name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest tests/test_app_boot.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  prono-tennis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PRONO/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall app
      - run: python -m pytest tests/test_tennis_atp_elo.py tests/test_tennis.py::TennisServiceTests::test_build_tennis_penalizes_ruud_with_coach_and_h2h -q
