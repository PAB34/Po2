name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "saas/backend/**"
      - "saas/frontend/**"
      - "saas/infra/**"
      - "saas/pronostics/**"
      - ".github/workflows/deploy.yml"

# Empeche deux deploys concurrents de se marcher dessus sur le VPS
# (git reset --hard + docker compose up --build simultanes = build casse).
# On serialise : un nouveau push attend la fin du deploy en cours.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_APP_PATH }}"
            REPO_URL="${{ secrets.REPO_SSH_URL }}"
            BRANCH_REF="origin/${{ github.ref_name }}"

            mkdir -p "$TARGET_DIR"

            if [ -d "$TARGET_DIR/.git" ]; then
              REPO_DIR="$TARGET_DIR"
            elif [ -d "$TARGET_DIR/repo/.git" ]; then
              REPO_DIR="$TARGET_DIR/repo"
            else
              git clone "$REPO_URL" "$TARGET_DIR/repo"
              REPO_DIR="$TARGET_DIR/repo"
            fi

            cd "$REPO_DIR"
            git fetch --all
            git reset --hard "$BRANCH_REF"

            if [ -f "$REPO_DIR/saas/infra/docker-compose.prod.yml" ]; then
              APP_DIR="$REPO_DIR/saas"
            elif [ -f "$REPO_DIR/infra/docker-compose.prod.yml" ]; then
              APP_DIR="$REPO_DIR"
            else
              echo "docker-compose.prod.yml introuvable depuis $REPO_DIR" >&2
              exit 1
            fi

            if [ -f "$APP_DIR/.env" ]; then
              ENV_FILE="$APP_DIR/.env"
            elif [ -f "$REPO_DIR/.env" ]; then
              ENV_FILE="$REPO_DIR/.env"
            else
              echo ".env introuvable dans $APP_DIR ou $REPO_DIR" >&2
              exit 1
            fi

            # Reseau partage prod <-> staging (le Caddy prod y est rattache pour
            # router staging.*). Idempotent ; requis car declare `external` dans le compose.
            docker network create po2-edge 2>/dev/null || true

            COMPOSE="docker compose -f $APP_DIR/infra/docker-compose.prod.yml --project-directory $APP_DIR/infra --env-file $ENV_FILE"

            $COMPOSE up -d --build

            # Caddy redémarre TOUJOURS (sinon 502 si le conteneur backend a une nouvelle IP)
            $COMPOSE restart caddy

            # Migrations Alembic — on attend que le backend soit prêt (5 s) puis on migre
            sleep 5
            $COMPOSE exec -T backend python -c "from app.core.db import SessionLocal; from sqlalchemy import text; db=SessionLocal(); db.execute(text(\"delete from alembic_version where version_num='0040' and exists (select 1 from alembic_version where version_num in ('0041','0042_cvc_inventory_workflow'))\")); db.execute(text(\"delete from alembic_version where version_num='0041' and exists (select 1 from alembic_version where version_num='0042_cvc_inventory_workflow')\")); db.commit(); db.close()"
            $COMPOSE exec -T backend alembic upgrade head
