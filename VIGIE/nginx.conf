server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # data/*.geojson : servi depuis data/*.geojson.gz (gunzip pour les rares clients sans gzip).
    location /data/ {
        gzip_static always;
        gunzip on;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
