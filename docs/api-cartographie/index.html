<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartographie API Po2</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-soft: #f1f5f9;
    --line: #d7dde8;
    --text: #172033;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --amber: #b45309;
    --red: #b91c1c;
    --violet: #6d28d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .grow { flex: 1; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  button:hover { border-color: var(--blue); }
  button.primary { background: var(--blue); border-color: var(--blue); color: white; }
  button.danger { color: var(--red); }
  input, select, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 9px;
  }
  textarea { min-height: 82px; resize: vertical; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 7px 12px;
    border-radius: 7px;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--blue); border-color: var(--blue-soft); background: var(--blue-soft); }
  .pill { font-size: 12px; color: var(--muted); }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    height: calc(100vh - 117px);
  }
  #network {
    min-height: 480px;
    border-right: 1px solid var(--line);
    background:
      linear-gradient(rgba(37, 99, 235, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37, 99, 235, .04) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  aside {
    background: var(--panel);
    overflow: auto;
  }
  .side-section { padding: 14px; border-bottom: 1px solid var(--line); }
  .side-section h2 { margin: 0 0 10px; font-size: 14px; }
  .field { margin: 10px 0; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .small { font-size: 12px; color: var(--muted); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; background: var(--panel-soft); }
  .hidden { display: none; }
  .list {
    height: calc(100vh - 117px);
    overflow: auto;
    background: var(--panel);
  }
  .router { border-bottom: 1px solid var(--line); }
  .router summary { cursor: pointer; padding: 10px 16px; font-weight: 650; }
  .endpoint { display: grid; grid-template-columns: 62px 1fr 90px; gap: 8px; padding: 8px 18px; border-top: 1px solid #edf0f5; cursor: pointer; }
  .endpoint:hover { background: var(--panel-soft); }
  .method { font-weight: 700; font-size: 12px; }
  .method.GET { color: #075985; }
  .method.POST { color: var(--green); }
  .method.PATCH, .method.PUT { color: var(--amber); }
  .method.DELETE { color: var(--red); }
  .status { font-size: 12px; color: var(--muted); text-align: right; }
  .friction { margin: 10px 0; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); }
  .friction h3 { margin: 0 0 4px; font-size: 14px; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    #network { height: 62vh; border-right: none; border-bottom: 1px solid var(--line); }
    aside { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Cartographie API Po2</h1>
    <div class="sub">Diagramme éditable Routeur -> Préfixe -> Endpoints</div>
  </div>
  <div class="grow"></div>
  <div class="pill" id="stats"></div>
  <button onclick="exportJson()">Exporter</button>
  <button onclick="document.getElementById('importFile').click()">Importer</button>
  <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importJson(event)" />
</header>

<div class="toolbar">
  <div class="tabs">
    <div class="tab active" data-view="graph" onclick="setView('graph')">Diagramme</div>
    <div class="tab" data-view="list" onclick="setView('list')">Liste</div>
    <div class="tab" data-view="frictions" onclick="setView('frictions')">Frictions</div>
  </div>
  <div class="grow"></div>
  <input id="search" style="max-width:340px" placeholder="Filtrer routeur, préfixe, endpoint..." oninput="setSearch(this.value)" />
  <button onclick="fitGraph()">Centrer</button>
  <button onclick="addNode()">+ Nœud</button>
  <button onclick="startAddEdge()">+ Relation</button>
  <button onclick="resetLayout()">Réinitialiser le graphe</button>
</div>

<div id="graphView" class="layout">
  <div id="network"></div>
  <aside id="inspector"></aside>
</div>
<div id="listView" class="list hidden"></div>
<div id="frictionsView" class="list hidden"></div>

<script src="api_catalog.js"></script>
<script src="vendor/vis-network.min.js"></script>
<script>
const STORAGE_KEY = "po2-api-cartographie-graph-v2";
const OLD_KEY = "po2-api-cartographie-v1";
const CAT = window.API_CATALOG || { endpoints: [], routers: [] };
const FRICTIONS = [
  {id:"sites", title:"3 représentations de site", detail:"Site patrimoine / CpeSite opérationnel / CpeDalkiaRefSite contractuel.", routers:["buildings","cpe","cpe-dalkia"]},
  {id:"meters", title:"3 surfaces de lien compteur", detail:"BuildingMeterLink / GasPce.building_id / EnergyInvoiceSite.prm.", routers:["buildings","grdf","billing"]},
  {id:"prix", title:"2 référentiels de prix", detail:"bpu_* historique vs BillingConfig/BillingBpuLine courant.", routers:["bpu","billing"]},
  {id:"inventaire", title:"2 inventaires techniques", detail:"BuildingEquipment SYPEMI vs CvcInventoryItem terrain.", routers:["equipment","cvc"]},
  {id:"matching_cpe", title:"Matching sites CPE absent", detail:"Le marché CPE n'est pas encore relié au patrimoine.", routers:["cpe","buildings"]},
  {id:"engie_proxy", title:"Proxy ENGIE non câblé", detail:"Endpoints /engie sans usage front identifié.", routers:["engie"]},
  {id:"pronostics", title:"Module hors périmètre", detail:"Jeu de pronostics sans lien avec la plateforme métier.", routers:["pronostics"]},
];

let store = loadStore();
let state = { view: "graph", search: "", selectedNode: null, selectedEdge: null };
let network = null;
let nodes = new vis.DataSet();
let edges = new vis.DataSet();

function defaultStore() {
  return {
    annotations: {},
    virtual: [],
    nodeOverrides: {},
    edgeOverrides: {},
    deletedNodes: {},
    deletedEdges: {},
    customNodes: {},
    customEdges: {},
    frictionNotes: {}
  };
}

function loadStore() {
  const base = defaultStore();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    Object.assign(base, saved);
  } catch {}
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || "{}");
    if (old.annotations && !Object.keys(base.annotations).length) base.annotations = old.annotations;
    if (old.virtual && !base.virtual.length) base.virtual = old.virtual;
    if (old.frictionNotes && !Object.keys(base.frictionNotes).length) base.frictionNotes = old.frictionNotes;
  } catch {}
  return base;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

function endpointId(e) {
  return e.id || `${e.method} ${e.path}`;
}

function allEndpoints() {
  return (CAT.endpoints || []).concat(store.virtual || []);
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c]));
}

function nodeLabelForEndpoint(e) {
  const id = endpointId(e);
  const o = store.nodeOverrides["endpoint:" + id] || {};
  const method = o.method || e.method;
  const path = o.path || e.path;
  return `${method} ${path.replace(/^\/api/, "")}`;
}

function baseGraph() {
  const n = {};
  const ed = {};
  for (const e of allEndpoints()) {
    const eid = endpointId(e);
    const epNode = "endpoint:" + eid;
    const routerName = (store.nodeOverrides[epNode] || {}).router || e.router || "(sans tag)";
    const prefixName = (store.nodeOverrides[epNode] || {}).prefix || e.prefix || "/";
    const routerNode = "router:" + routerName;
    const prefixNode = `prefix:${routerName}:${prefixName}`;
    n[routerNode] = { id: routerNode, label: routerName, type: "router", router: routerName };
    n[prefixNode] = { id: prefixNode, label: prefixName, type: "prefix", router: routerName, prefix: prefixName };
    n[epNode] = {
      id: epNode,
      label: nodeLabelForEndpoint(e),
      type: "endpoint",
      endpointId: eid,
      method: e.method,
      path: e.path,
      router: routerName,
      prefix: prefixName,
      fn: e.fn || "",
      doc: e.doc || e.summary || "",
      virtual: !!e.virtual
    };
    ed[`edge:${routerNode}->${prefixNode}`] = { id: `edge:${routerNode}->${prefixNode}`, from: routerNode, to: prefixNode, label: "préfixe" };
    ed[`edge:${prefixNode}->${epNode}`] = { id: `edge:${prefixNode}->${epNode}`, from: prefixNode, to: epNode, label: "endpoint" };
  }
  Object.assign(n, store.customNodes || {});
  Object.assign(ed, store.customEdges || {});
  return { nodes: n, edges: ed };
}

function decorateNode(raw) {
  const o = store.nodeOverrides[raw.id] || {};
  const merged = Object.assign({}, raw, o);
  const status = merged.type === "endpoint" ? (store.annotations[merged.endpointId] || {}).status : merged.status;
  const colors = {
    router: { background: "#dbeafe", border: "#2563eb" },
    prefix: { background: "#ecfdf5", border: "#15803d" },
    endpoint: { background: "#ffffff", border: "#94a3b8" },
    custom: { background: "#fef3c7", border: "#b45309" }
  };
  const statusBorder = { keep: "#15803d", review: "#b45309", remove: "#b91c1c", planned: "#6d28d9" };
  return {
    id: merged.id,
    label: merged.label,
    title: mergedTitle(merged),
    shape: merged.type === "endpoint" ? "box" : "ellipse",
    color: {
      background: (colors[merged.type] || colors.custom).background,
      border: statusBorder[status] || (colors[merged.type] || colors.custom).border
    },
    borderWidth: status ? 3 : 1,
    font: { color: "#172033", face: "system-ui", size: merged.type === "endpoint" ? 13 : 15 },
    margin: merged.type === "endpoint" ? 8 : 12,
    type: merged.type
  };
}

function mergedTitle(n) {
  if (n.type !== "endpoint") return esc(n.label);
  const a = store.annotations[n.endpointId] || {};
  return esc(`${n.method || ""} ${n.path || ""}\n${n.fn || ""}\n${a.comment || ""}`);
}

function visibleGraph() {
  const graph = baseGraph();
  const q = state.search.trim().toLowerCase();
  const keepNodes = new Set();
  const resultNodes = [];
  const resultEdges = [];

  for (const raw of Object.values(graph.nodes)) {
    if (store.deletedNodes[raw.id]) continue;
    const merged = Object.assign({}, raw, store.nodeOverrides[raw.id] || {});
    const hay = [merged.label, merged.router, merged.prefix, merged.path, merged.method, merged.fn, merged.doc].join(" ").toLowerCase();
    if (!q || hay.includes(q)) {
      keepNodes.add(raw.id);
      if (merged.type === "endpoint") {
        keepNodes.add(`prefix:${merged.router}:${merged.prefix}`);
        keepNodes.add(`router:${merged.router}`);
      }
      if (merged.type === "prefix") keepNodes.add(`router:${merged.router}`);
    }
  }

  for (const raw of Object.values(graph.nodes)) {
    if (!keepNodes.has(raw.id) || store.deletedNodes[raw.id]) continue;
    resultNodes.push(decorateNode(raw));
  }
  for (const raw of Object.values(graph.edges)) {
    if (store.deletedEdges[raw.id]) continue;
    const merged = Object.assign({}, raw, store.edgeOverrides[raw.id] || {});
    if (keepNodes.has(merged.from) && keepNodes.has(merged.to)) {
      resultEdges.push({
        id: merged.id,
        from: merged.from,
        to: merged.to,
        label: merged.label || "",
        arrows: "to",
        color: { color: "#94a3b8" },
        font: { align: "middle", color: "#64748b", size: 11 },
        smooth: { type: "cubicBezier", roundness: 0.25 }
      });
    }
  }
  return { nodes: resultNodes, edges: resultEdges };
}

function initNetwork() {
  const container = document.getElementById("network");
  const data = visibleGraph();
  nodes = new vis.DataSet(data.nodes);
  edges = new vis.DataSet(data.edges);
  network = new vis.Network(container, { nodes, edges }, {
    layout: { hierarchical: { enabled: true, direction: "LR", sortMethod: "directed", levelSeparation: 190, nodeSpacing: 120 } },
    physics: false,
    interaction: { hover: true, multiselect: true, navigationButtons: true, keyboard: true },
    manipulation: {
      enabled: false,
      addEdge: function(edgeData, callback) {
        if (edgeData.from === edgeData.to) return callback(null);
        const label = prompt("Libellé de la relation :", "relie");
        const id = `custom-edge:${Date.now()}`;
        const edge = { id, from: edgeData.from, to: edgeData.to, label: label || "relie" };
        store.customEdges[id] = edge;
        save();
        callback(edge);
        network.disableEditMode();
      }
    }
  });
  network.on("selectNode", params => {
    state.selectedNode = params.nodes[0] || null;
    state.selectedEdge = null;
    renderInspector();
  });
  network.on("selectEdge", params => {
    state.selectedEdge = params.edges[0] || null;
    if (!params.nodes.length) state.selectedNode = null;
    renderInspector();
  });
  network.on("deselectNode", params => {
    if (!params.nodes.length && !params.edges.length) {
      state.selectedNode = null;
      state.selectedEdge = null;
      renderInspector();
    }
  });
}

function refreshGraph() {
  if (!network) return;
  const data = visibleGraph();
  nodes.clear();
  edges.clear();
  nodes.add(data.nodes);
  edges.add(data.edges);
  renderInspector();
  renderStats();
}

function rawNode(id) {
  const graph = baseGraph();
  return graph.nodes[id] ? Object.assign({}, graph.nodes[id], store.nodeOverrides[id] || {}) : null;
}

function rawEdge(id) {
  const graph = baseGraph();
  return graph.edges[id] ? Object.assign({}, graph.edges[id], store.edgeOverrides[id] || {}) : null;
}

function renderInspector() {
  const el = document.getElementById("inspector");
  if (state.selectedEdge) {
    const e = rawEdge(state.selectedEdge);
    if (!e) return el.innerHTML = emptyInspector();
    el.innerHTML = edgeInspector(e);
    return;
  }
  if (!state.selectedNode) {
    el.innerHTML = emptyInspector();
    return;
  }
  const n = rawNode(state.selectedNode);
  if (!n) return el.innerHTML = emptyInspector();
  el.innerHTML = nodeInspector(n);
}

function emptyInspector() {
  return `<div class="side-section">
    <h2>Sélection</h2>
    <p class="small">Clique un nœud ou une relation pour modifier son libellé, son type, son statut ou ses liens.</p>
    <div class="legend">
      <span>Routeur</span><span>Préfixe</span><span>Endpoint</span><span>Relation</span>
    </div>
  </div>
  <div class="side-section">
    <h2>Mode d'emploi</h2>
    <p class="small">Double-clic possible pour zoomer. Utilise <b>+ Relation</b>, puis clique deux nœuds pour créer un lien. Les suppressions et renommages restent dans ton navigateur jusqu'à export.</p>
  </div>`;
}

function nodeInspector(n) {
  const a = n.endpointId ? (store.annotations[n.endpointId] || {}) : {};
  return `<div class="side-section">
    <h2>Nœud</h2>
    <div class="field"><label>Libellé</label><input value="${esc(n.label)}" oninput="updateNode('${esc(n.id)}', {label:this.value})" /></div>
    <div class="field"><label>Type</label><select onchange="updateNode('${esc(n.id)}', {type:this.value})">${options(["router","prefix","endpoint","custom"], n.type)}</select></div>
    ${n.type === "endpoint" ? endpointFields(n, a) : ""}
    <div class="field"><label>Commentaire</label><textarea oninput="updateNodeComment('${esc(n.id)}', this.value)">${esc(a.comment || n.comment || "")}</textarea></div>
    <div class="row">
      <button class="danger" onclick="deleteNode('${esc(n.id)}')">Supprimer le nœud</button>
      <button onclick="duplicateNode('${esc(n.id)}')">Dupliquer</button>
    </div>
  </div>`;
}

function endpointFields(n, a) {
  return `<div class="row">
      <div class="field"><label>Méthode</label><input value="${esc(n.method || "")}" oninput="updateNode('${esc(n.id)}', {method:this.value.toUpperCase()})" /></div>
      <div class="field"><label>Statut</label><select onchange="updateAnnotation('${esc(n.endpointId)}', {status:this.value})">${options(["","keep","review","remove","planned"], a.status || "")}</select></div>
    </div>
    <div class="field"><label>Chemin</label><input value="${esc(n.path || "")}" oninput="updateNode('${esc(n.id)}', {path:this.value, label:(('${esc(n.method || "")}'||'')+' '+this.value.replace(/^\\/api/,''))})" /></div>
    <div class="row">
      <div class="field"><label>Routeur</label><input value="${esc(n.router || "")}" oninput="updateNode('${esc(n.id)}', {router:this.value})" /></div>
      <div class="field"><label>Préfixe</label><input value="${esc(n.prefix || "")}" oninput="updateNode('${esc(n.id)}', {prefix:this.value})" /></div>
    </div>
    <div class="field"><label>Fonction backend</label><input value="${esc(n.fn || "")}" oninput="updateNode('${esc(n.id)}', {fn:this.value})" /></div>
    <div class="row">
      <div class="field"><label>Utile front</label><select onchange="updateAnnotation('${esc(n.endpointId)}', {front:this.value})">${options(["","yes","no","maybe"], a.front || "")}</select></div>
      <div class="field"><label>Utile back</label><select onchange="updateAnnotation('${esc(n.endpointId)}', {back:this.value})">${options(["","yes","no","maybe"], a.back || "")}</select></div>
    </div>`;
}

function edgeInspector(e) {
  return `<div class="side-section">
    <h2>Relation</h2>
    <div class="field"><label>Libellé</label><input value="${esc(e.label || "")}" oninput="updateEdge('${esc(e.id)}', {label:this.value})" /></div>
    <div class="field"><label>Depuis</label><input value="${esc(e.from)}" oninput="updateEdge('${esc(e.id)}', {from:this.value})" /></div>
    <div class="field"><label>Vers</label><input value="${esc(e.to)}" oninput="updateEdge('${esc(e.id)}', {to:this.value})" /></div>
    <button class="danger" onclick="deleteEdge('${esc(e.id)}')">Supprimer la relation</button>
  </div>`;
}

function options(values, current) {
  const labels = { keep:"garder", review:"revoir", remove:"retirer", planned:"planifié", yes:"oui", no:"non", maybe:"à vérifier", "":"" };
  return values.map(v => `<option value="${esc(v)}" ${v === current ? "selected" : ""}>${esc(labels[v] || v)}</option>`).join("");
}

function updateNode(id, patch) {
  store.nodeOverrides[id] = Object.assign({}, store.nodeOverrides[id] || {}, patch);
  save();
  refreshGraph();
}

function updateNodeComment(id, value) {
  const n = rawNode(id);
  if (n && n.endpointId) updateAnnotation(n.endpointId, { comment: value });
  else updateNode(id, { comment: value });
}

function updateAnnotation(id, patch) {
  store.annotations[id] = Object.assign({}, store.annotations[id] || {}, patch);
  save();
  refreshGraph();
}

function updateEdge(id, patch) {
  store.edgeOverrides[id] = Object.assign({}, store.edgeOverrides[id] || {}, patch);
  save();
  refreshGraph();
}

function deleteNode(id) {
  if (!confirm("Supprimer ce nœud du diagramme ?")) return;
  store.deletedNodes[id] = true;
  for (const e of Object.values(baseGraph().edges)) {
    if (e.from === id || e.to === id) store.deletedEdges[e.id] = true;
  }
  state.selectedNode = null;
  save();
  refreshGraph();
}

function deleteEdge(id) {
  if (!confirm("Supprimer cette relation du diagramme ?")) return;
  store.deletedEdges[id] = true;
  state.selectedEdge = null;
  save();
  refreshGraph();
}

function duplicateNode(id) {
  const n = rawNode(id);
  if (!n) return;
  const newId = `custom-node:${Date.now()}`;
  store.customNodes[newId] = Object.assign({}, n, { id: newId, label: n.label + " copie", type: n.type || "custom", endpointId: undefined });
  save();
  refreshGraph();
}

function addNode() {
  const label = prompt("Libellé du nouveau nœud :", "Nouveau nœud");
  if (!label) return;
  const type = prompt("Type (router, prefix, endpoint, custom) :", "custom") || "custom";
  const id = `custom-node:${Date.now()}`;
  store.customNodes[id] = { id, label, type, router: "", prefix: "", method: "", path: "", fn: "", doc: "" };
  save();
  refreshGraph();
}

function startAddEdge() {
  network.addEdgeMode();
}

function fitGraph() {
  if (network) network.fit({ animation: true });
}

function resetLayout() {
  if (!confirm("Réinitialiser suppressions, nœuds personnalisés et relations personnalisées ? Les annotations d'audit sont conservées.")) return;
  store.nodeOverrides = {};
  store.edgeOverrides = {};
  store.deletedNodes = {};
  store.deletedEdges = {};
  store.customNodes = {};
  store.customEdges = {};
  save();
  refreshGraph();
}

function setSearch(v) {
  state.search = v;
  refreshGraph();
  renderList();
}

function setView(view) {
  state.view = view;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  document.getElementById("graphView").classList.toggle("hidden", view !== "graph");
  document.getElementById("listView").classList.toggle("hidden", view !== "list");
  document.getElementById("frictionsView").classList.toggle("hidden", view !== "frictions");
  if (view === "list") renderList();
  if (view === "frictions") renderFrictions();
  if (view === "graph") setTimeout(() => network && network.redraw(), 0);
}

function renderStats() {
  const eps = allEndpoints();
  const annotated = eps.filter(e => Object.keys(store.annotations[endpointId(e)] || {}).length).length;
  document.getElementById("stats").textContent = `${eps.length} endpoints · ${CAT.router_count || CAT.routers.length} routeurs · ${annotated} annotés`;
}

function renderList() {
  const q = state.search.trim().toLowerCase();
  const groups = {};
  for (const e of allEndpoints()) {
    const id = endpointId(e);
    const n = rawNode("endpoint:" + id) || e;
    const text = [n.router || e.router, n.prefix || e.prefix, n.method || e.method, n.path || e.path, n.fn || e.fn].join(" ").toLowerCase();
    if (q && !text.includes(q)) continue;
    const router = n.router || e.router || "(sans tag)";
    (groups[router] = groups[router] || []).push({ e, n });
  }
  const html = Object.keys(groups).sort().map(router => `<details class="router" open>
    <summary>${esc(router)} <span class="small">${groups[router].length} endpoints</span></summary>
    ${groups[router].map(({e,n}) => {
      const id = endpointId(e);
      const a = store.annotations[id] || {};
      return `<div class="endpoint" onclick="selectEndpoint('${esc(id)}')">
        <span class="method ${esc(n.method || e.method)}">${esc(n.method || e.method)}</span>
        <code>${esc(n.path || e.path)}</code>
        <span class="status">${esc(a.status || "")}</span>
      </div>`;
    }).join("")}
  </details>`).join("");
  document.getElementById("listView").innerHTML = html || `<p style="padding:16px" class="small">Aucun résultat.</p>`;
}

function selectEndpoint(id) {
  setView("graph");
  const nodeId = "endpoint:" + id;
  state.selectedNode = nodeId;
  state.selectedEdge = null;
  network.selectNodes([nodeId]);
  network.focus(nodeId, { scale: 1.1, animation: true });
  renderInspector();
}

function renderFrictions() {
  document.getElementById("frictionsView").innerHTML = `<div style="max-width:860px;padding:16px">
    ${FRICTIONS.map(f => `<div class="friction">
      <h3>${esc(f.title)}</h3>
      <div class="small">${esc(f.detail)}</div>
      <div class="small">Routeurs : ${f.routers.map(esc).join(", ")}</div>
      <div class="field"><textarea oninput="store.frictionNotes['${esc(f.id)}']=this.value; save()">${esc(store.frictionNotes[f.id] || "")}</textarea></div>
    </div>`).join("")}
  </div>`;
}

function exportJson() {
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), store }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "api_cartographie_graph.json";
  a.click();
}

function importJson(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      const incoming = payload.store || payload;
      store = Object.assign(defaultStore(), store, incoming);
      save();
      refreshGraph();
      renderList();
      renderFrictions();
      alert("Import terminé.");
    } catch (err) {
      alert("Import impossible : " + err.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

renderStats();
initNetwork();
renderInspector();
</script>
</body>
</html>
