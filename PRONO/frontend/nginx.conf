server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques ; tout le reste retombe sur l'app (SPA simple).
    location / {
        try_files $uri /index.html;
    }

    # Les fichiers de code et l'HTML ne doivent jamais survivre a un deploiement.
    # Le motif couvre les noms versionnes actuels et les extensions du radar tennis.
    location ~ ^/(?:index\.html|(?:app|sw|tennis-outsider-radar)(?:-[A-Za-z0-9-]+)?\.js|(?:styles|tennis-outsider-radar)(?:-[A-Za-z0-9-]+)?\.css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Les appels /api/* sont routes vers le backend par Caddy (pas ici).
}
