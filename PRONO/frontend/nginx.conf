server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques ; tout le reste retombe sur l'app (SPA simple).
    location / {
        try_files $uri /index.html;
    }
    # Les appels /api/* sont routés vers le backend par Caddy (pas ici).
}
