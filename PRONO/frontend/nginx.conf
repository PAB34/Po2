server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques ; tout le reste retombe sur l'app (SPA simple).
    location / {
        try_files $uri /index.html;
    }
    location ~ ^/(?:index\.html|app\.js|styles\.css|sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }
    # Les appels /api/* sont routés vers le backend par Caddy (pas ici).
}
