# Outil de métré thermique : même build, second point d'entrée (thermique.html),
# servi sur le sous-domaine thermique.* ou sous /thermique/.
map $host $po2_spa_index {
    default        /index.html;
    ~^thermique\.  /thermique.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /thermique/ {
        try_files $uri /thermique.html;
    }

    location / {
        try_files $uri $po2_spa_index;
    }
}
