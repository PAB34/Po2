services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - db
    volumes:
      - ../../:/workspace:ro
      - ../../saas/energie/output:/workspace/saas/energie/output
      - invoice_data:/app/storage/invoices

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend

  pronostics:
    build:
      context: ../pronostics
    restart: unless-stopped
    depends_on:
      - backend

  # --- PRONO : app privée Ligue 1 (sous-domaine ligue1.patrimoineaucarre.com) ---
  prono-backend:
    build:
      context: ../../PRONO/backend
    restart: unless-stopped
    environment:
      PRONO_SECRET_KEY: ${PRONO_SECRET_KEY}
      PRONO_ADMIN_EMAIL: ${PRONO_ADMIN_EMAIL}
      PRONO_ADMIN_PASSWORD: ${PRONO_ADMIN_PASSWORD}
      PRONO_TOKEN_MINUTES: ${PRONO_TOKEN_MINUTES:-1440}
      PRONO_CORS_ORIGINS: https://ligue1.patrimoineaucarre.com
      PRONO_DATA_DIR: /data
    volumes:
      - prono_data:/data

  prono-frontend:
    build:
      context: ../../PRONO/frontend
    restart: unless-stopped
    depends_on:
      - prono-backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - frontend
      - pronostics
      - prono-frontend
      - prono-backend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # `default` = reseau implicite du projet (prod). `edge` = reseau partage avec
    # le projet staging pour router staging.* vers backend-staging / frontend-staging.
    networks:
      - default
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  invoice_data:
  prono_data:

networks:
  edge:
    external: true
    name: po2-edge
